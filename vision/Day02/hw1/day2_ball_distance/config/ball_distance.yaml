/**:
  ros__parameters:
    # PPT 링크의 insta360_usb_cam 기본 토픽이다. 이름과 달리 메시지 형식은
    # sensor_msgs/msg/Image이므로 sensor_msgs/msg/CompressedImage로 바꾸지 않는다.
    image_topic: "/camera1/camera/compressed_image"
    camera_info_topic: "/camera1/info"
    debug_image_topic: "/ball_distance/debug_image"
    pan_tilt_command_topic: "/camera1/pan_tilt"
    pan_tilt_status_topic: "/camera1/pan_tilt_status"

    # OpenCV HSV 범위: H=0~179, S/V=0~255
    yellow_h_min: 20
    yellow_h_max: 40
    yellow_s_min: 100
    yellow_s_max: 255
    yellow_v_min: 80
    yellow_v_max: 255

    min_area_px: 500.0
    min_circularity: 0.55
    morphology_kernel_size: 5
    use_undistort: true

    # 실측 후 반드시 입력한다. 0.0이면 해당 거리 계산을 비활성화한다.
    ball_diameter_m: 0.066
    camera_height_m: 0.0
    camera_pitch_deg: 0.0
    auto_tilt_camera: true
    auto_tracking: true

    # 자동 추적을 천천히 감쇠시켜 짐벌의 상하좌우 진동을 막는다.
    tracking_deadband_px: 35
    tracking_reacquire_px: 60
    tracking_max_step_deg: 1.5
    tracking_gain: 0.35
    tracking_smoothing_alpha: 0.35
    tracking_command_period_ms: 200
    tracking_lock_cycles: 3
    tracking_lost_timeout_ms: 750

    # 보고서 측정 시 실제 거리를 넣으면 화면에 절대오차가 함께 표시된다.
    # 측정하지 않을 때는 0.0으로 둔다.
    ground_truth_m: 0.0
